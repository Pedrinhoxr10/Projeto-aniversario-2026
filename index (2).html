<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏐 Presente Especial</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');

/* ═══════════════════════════
   RESET & BASE
═══════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0d0b08;
  font-family: 'Rajdhani', sans-serif;
  overflow: hidden;
  user-select: none;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ═══════════════════════════
   SCREENS (Telas do Jogo)
═══════════════════════════ */
.screen {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
.screen.active {
  opacity: 1;
  pointer-events: all;
}

/* ═══════════════════════════
   TELA 1: INICIAL
═══════════════════════════ */
#s-intro {
  background: radial-gradient(ellipse at 50% 100%, #2a1505 0%, #0d0b08 65%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.intro-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  border-radius: 50%;
  animation: particleFloat linear infinite;
  opacity: 0;
}
@keyframes particleFloat {
  0%   { transform: translateY(0) scale(1);   opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 0.6; }
  100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
}

.intro-ground-glow {
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 500px; height: 160px;
  background: radial-gradient(ellipse, rgba(232,98,10,0.15) 0%, transparent 70%);
  pointer-events: none;
}

.intro-topline {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, #e8620a, #4dbfa0, transparent);
}

.intro-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.intro-eyebrow {
  font-size: 11px;
  letter-spacing: 6px;
  color: #e8620a;
  text-transform: uppercase;
  animation: fadeUp 0.8s 0.1s both;
}

/* Wrapper do Oikawa na tela inicial */
.oikawa-wrap {
  animation: fadeUp 0.9s 0.2s both, floatAnim 3.5s 1.2s ease-in-out infinite;
  margin: 10px 0;
  filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6));
}
@keyframes floatAnim {
  0%, 100% { transform: translateY(0px);   }
  50%       { transform: translateY(-12px); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0);    }
}

.intro-title {
  font-size: clamp(28px, 6.5vw, 52px);
  font-weight: 700;
  color: #f5f0e8;
  text-align: center;
  line-height: 1.1;
  animation: fadeUp 0.8s 0.55s both;
}
.intro-title span { color: #e8620a; }

.intro-subtitle {
  font-size: 13px;
  letter-spacing: 3px;
  color: #a38d73;
  animation: fadeUp 0.8s 0.7s both;
}

.start-btn {
  margin-top: 20px;
  background: linear-gradient(135deg, #e8620a, #c84e08);
  border: none;
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 4px;
  padding: 14px 52px;
  border-radius: 50px;
  cursor: pointer;
  text-transform: uppercase;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.8s 0.9s both;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 0 0 0 rgba(232,98,10,0.5);
}
.start-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  border-radius: inherit;
}
.start-btn:hover {
  transform: scale(1.06) translateY(-2px);
  box-shadow: 0 8px 30px rgba(232,98,10,0.4);
}
.start-btn:active { transform: scale(0.98); }
.start-btn::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  border: 2px solid rgba(232,98,10,0.5);
  animation: btnPulse 2.5s 1.5s ease-out infinite;
}
@keyframes btnPulse {
  0%   { transform: scale(1);   opacity: 0.8; }
  100% { transform: scale(1.15); opacity: 0;   }
}

.intro-footer {
  position: absolute;
  bottom: 14px;
  left: 0; right: 0;
  text-align: center;
  font-size: 10px;
  letter-spacing: 3px;
  color: #4a3a25;
  animation: fadeUp 0.8s 1.1s both;
}


/* ═══════════════════════════
   TELA 2: QUADRA E PORTAS
═══════════════════════════ */
#s-quadra {
  background: linear-gradient(180deg, #3a1d3d 0%, #6b2d4a 38%, #b8551f 62%, #2a1608 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  overflow: hidden;
}

/* brilho quente atrás das portas */
.quadra-glow {
  position: absolute;
  top: 6%; left: 50%;
  transform: translateX(-50%);
  width: 75%; height: 260px;
  background: radial-gradient(ellipse, rgba(255,180,120,0.28) 0%, transparent 72%);
  pointer-events: none;
  z-index: 0;
}

/* varalzinho de luzes no alto */
.string-lights {
  position: absolute;
  top: 3%; left: 4%; right: 4%;
  height: 20px;
  display: flex;
  justify-content: space-evenly;
  pointer-events: none;
  z-index: 1;
}
.string-lights span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 9px 3px currentColor;
  animation: lightFlicker 2.4s ease-in-out infinite;
}
@keyframes lightFlicker {
  0%, 100% { opacity: .5; }
  50%      { opacity: 1;  }
}

/* coraçõezinhos flutuando */
.quadra-hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}
.heart-particle {
  position: absolute;
  bottom: -20px;
  animation: heartFloat linear infinite;
  opacity: 0;
}
@keyframes heartFloat {
  0%   { transform: translateY(0) translateX(0) scale(0.8);      opacity: 0;  }
  10%  { opacity: .75; }
  50%  { transform: translateY(-48vh) translateX(10px) scale(1); }
  90%  { opacity: .45; }
  100% { transform: translateY(-95vh) translateX(-8px) scale(0.7); opacity: 0; }
}

/* Chão laranja estilo Haikyuu */
.court-floor {
  height: 45%;
  background: #d96941;
  position: relative;
  border-top: 6px solid #fff;
  z-index: 2;
}
.court-lines {
  position: absolute;
  inset: 15px;
  border: 4px solid #fff;
}
.court-lines::after {
  content: '';
  position: absolute;
  left: 50%; top: 0; bottom: 0;
  width: 4px; background: #fff;
  transform: translateX(-50%);
}

/* Portas */
.doors-container {
  position: absolute;
  top: 33%;
  left: 0; right: 0;
  display: flex;
  justify-content: space-evenly;
  align-items: flex-end;
  padding: 0 4%;
  z-index: 3;
}
.door {
  width: 78px; height: 118px;
  background: #4dbfa0; /* Verde Aoba Johsai */
  border: 4px solid #fff;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s;
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
}
.door:hover { transform: scale(1.08); }
.door-icon { font-size: 30px; margin-bottom: 6px; }
.door-label { font-size: 12.5px; font-weight: bold; color: #fff; background: #222; padding: 2px 6px; border-radius: 4px; text-align: center; line-height: 1.15;}
.door-label small { font-size: 9.5px; display: block; margin-top: 1px; font-weight: 600; }

@media (max-width: 460px) {
  .door { width: 64px; height: 96px; }
  .door-icon { font-size: 24px; margin-bottom: 4px; }
  .door-label { font-size: 10.5px; padding: 2px 4px; }
  .door-label small { font-size: 8px; }
}

/* Personagem móvel na quadra */
#player-character {
  position: absolute;
  bottom: 8%; /* Posiciona no chão da quadra */
  left: 50%; /* Inicia no centro da tela */
  transform: translateX(-50%);
  transition: left 1.5s ease-in-out; /* Mágica do movimento horizontal suave */
  width: 140px; 
  z-index: 10;
}
#player-character svg {
  width: 100%;
  height: auto;
  filter: drop-shadow(0 15px 10px rgba(0,0,0,0.4));
}

</style>
</head>

<script>
/* Partículas de fundo (Tela Inicial) */
(function spawnParticles() {
  const container = document.getElementById('particles');
  const colors = ['#e8620a','#f5820a','#4dbfa0','#fbbf24','#f0f0f6'];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 4;
    const left = Math.random() * 100;
    const delay = Math.random() * 8;
    const dur = 6 + Math.random() * 8;
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.cssText = `width: ${size}px; height: ${size}px; left: ${left}%; bottom: -10px; background: ${color}; animation-duration: ${dur}s; animation-delay: ${delay}s; opacity: 0;`;
    container.appendChild(p);
  }
})();

/* Luzes decorativas do varal na quadra */
(function spawnStringLights() {
  const container = document.getElementById('string-lights');
  const colors = ['#ffd7a3', '#ff9ecb', '#a3fff0', '#ffe9a3'];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    s.style.color = colors[Math.floor(Math.random() * colors.length)];
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    container.appendChild(s);
  }
})();

/* Coraçõezinhos flutuando na quadra */
(function spawnHearts() {
  const container = document.getElementById('quadra-hearts');
  const colors = ['#ff8fb3', '#ffb37a', '#c98fff', '#ff6f91'];
  for (let i = 0; i < 16; i++) {
    const h = document.createElement('div');
    h.className = 'heart-particle';
    h.textContent = '♥';
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = (10 + Math.random() * 14) + 'px';
    h.style.color = colors[Math.floor(Math.random() * colors.length)];
    h.style.animationDuration = (7 + Math.random() * 8) + 's';
    h.style.animationDelay = (Math.random() * 8) + 's';
    container.appendChild(h);
  }
})();

/* Oculta as telas e mostra a tela solicitada */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* Acionado ao clicar em Começar */
function startGame() {
  showScreen('s-quadra');
}

/* Lógica de clique na porta e movimentação */
function walkToDoor(doorId, doorName, event) {
  const player = document.getElementById('player-character');
  const clickedDoor = event.currentTarget;
  
  // Pega as dimensões e posição do clique para centralizar o personagem
  const doorRect = clickedDoor.getBoundingClientRect();
  const doorCenterX = doorRect.left + (doorRect.width / 2);
  
  // O CSS Transition entra em ação aqui, movendo suavemente
  player.style.left = doorCenterX + 'px';
  
  // O setTimeout espera 1.5s (o tempo exato da caminhada) para abrir o diálogo
  setTimeout(() => {
    const querEntrar = confirm(`Deseja entrar na sala: ${doorName}?`);
    
    if (querEntrar) {
      alert(`Você vai entrar na ${doorName}! \n(O conteúdo dessa sala será feito na próxima etapa)`);
      // Aqui faremos a chamada para abrir a sala específica
    } else {
      // Se ela cancelar, ele volta pro centro da quadra
      player.style.left = '50%';
    }
  }, 1500); 
}
</script>
</body>
</html>
